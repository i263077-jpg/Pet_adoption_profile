<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Adoption Profile</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <div class="nav-left">
        <span class="material-symbols-outlined">menu</span>
      </div>
      <div class="nav-right">
        <span class="material-symbols-outlined">search</span>
        <span class="material-symbols-outlined">favorite</span>
      </div>
    </nav>

    <h1>Pet Adoption Profile</h1>
    <img
      src="image/pexels-sefa-demirtas-2152709769-32557420.jpg"
      width="300"
      alt="Pet profile picture"
    />

    <table>
      <tr>
        <th>Name</th>
        <th>Type</th>
        <th>Sex</th>
        <th>Age</th>
      </tr>
      <tr>
        <td>Meow</td>
        <td>Cat</td>
        <td>Male</td>
        <td>1 year</td>
      </tr>
      <tr>
        <td>JACK</td>
        <td>Cat</td>
        <td>Male</td>
        <td>2 year</td>
      </tr>
      <tr>
        <td>Daisy</td>
        <td>Dog</td>
        <td>Female</td>
        <td>3 year</td>
      </tr>
    </table>

    <button type="button" onclick="say()">Adopt</button>

    <script src="script.js"></script>
  </body>
</html>
